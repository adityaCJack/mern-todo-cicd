name: CI-CD to EC2 via ECR

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-south-2 \
          | docker login --username AWS --password-stdin 754248136600.dkr.ecr.ap-south-2.amazonaws.com

      - name: Build, Tag, Push Images
        run: |
          # Backend 1
          docker build -t todo-backend ./todo-backend
          docker tag todo-backend:latest 754248136600.dkr.ecr.ap-south-2.amazonaws.com/todo-backend:latest
          docker push 754248136600.dkr.ecr.ap-south-2.amazonaws.com/todo-backend:latest

          # Backend 2
          docker build -t todo-backend-2 ./todo-backend-2
          docker tag todo-backend-2:latest 754248136600.dkr.ecr.ap-south-2.amazonaws.com/todo-backend-2:latest
          docker push 754248136600.dkr.ecr.ap-south-2.amazonaws.com/todo-backend-2:latest

          # Frontend
          docker build -t todo-frontend ./todo-frontend
          docker tag todo-frontend:latest 754248136600.dkr.ecr.ap-south-2.amazonaws.com/todo-frontend:latest
          docker push 754248136600.dkr.ecr.ap-south-2.amazonaws.com/todo-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd app
            ./deploy.sh
