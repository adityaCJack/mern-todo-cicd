name: Deploy Frontend

on:
  push:
    branches: [dev]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install deps
        run: |
          cd todo-frontend
          npm install

      - name: Build
        run: |
          cd todo-frontend
          npm run build

      - name: Deploy to S3
        uses: aws-actions/s3-sync@v1
        with:
          args: --delete
        env:
          AWS_S3_BUCKET: react-todo-app-adi
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ap-south-2
          SOURCE_DIR: todo-frontend/build
